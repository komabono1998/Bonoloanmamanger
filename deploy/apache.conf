# Apache settings for the container
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
# Real client address from the TLS proxy (needed for login monitoring)
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
</IfModule>
